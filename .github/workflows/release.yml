name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 v1.6.4，留空则仅在 main 构建并建立公共缓存）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3.exe
          key: wails3-v3.0.0-beta.8-${{ runner.os }}

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          $goBin = Join-Path (go env GOPATH) 'bin'
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows application
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $target = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:REF_NAME }
          $version = $target -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            if ($env:REF_NAME -eq 'main') {
              $version = '0.0.0'
            } else {
              throw "Release tag must use the v1.2.3 format, got: $target"
            }
          }
          .\build.ps1 -Version $version

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/') || (inputs.version != '' && inputs.version != null)
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $target = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:REF_NAME }
          $tag = if ($target.StartsWith('v')) { $target } else { "v$target" }
          $assetName = "zashdesktop-windows-amd64-$tag.exe"
          Copy-Item -LiteralPath build\bin\zashdesktop.exe -Destination $assetName

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (inputs.version != '' && inputs.version != null)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $target = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:REF_NAME }
          $tag = if ($target.StartsWith('v')) { $target } else { "v$target" }
          $assetName = "zashdesktop-windows-amd64-$tag.exe"
          gh release create $tag $assetName --title "zashdesktop $tag" --generate-notes
